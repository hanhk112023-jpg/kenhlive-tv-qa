name: KS diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - shell: bash
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          PASS="***"
          echo "PASSLEN=${#PASS}"
          echo "KSPASSLEN=${#KS_PASS}"
          echo "B64LEN=${#KS_B64}"
          echo "ALIASLEN=${#KS_ALIAS}"
