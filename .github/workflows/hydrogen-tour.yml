name: Hydrogen APK Video Tour

# Quay video quá trình test bản Hydrogen (repo kenhlive-hydrogen) trên
# Android TV emulator, theo kiểu KHÁM PHÁ (tour tự dò UI, không kịch bản cứng).
# Source checkout bằng deploy key HYDROGEN_CHECKOUT_KEY (path app/).
# Kết quả giao bằng COMMIT vào repo này (hydrogen-tour/: video + APK +
# log khám phá + ảnh màn hình) vì artifact storage của tài khoản đang đầy
# (GitHub chỉ tính lại sau 6-12h nên upload artifact vẫn lỗi quota);
# upload artifact chỉ là phụ (continue-on-error).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout QA repo (tour scripts)
        uses: actions/checkout@v4

      - name: Checkout Hydrogen source (private)
        uses: actions/checkout@v4
        with:
          repository: hanhk112023-jpg/kenhlive-hydrogen
          ref: main
          ssh-key: ${{ secrets.HYDROGEN_CHECKOUT_KEY }}
          path: app

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Run exploratory video tour on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          # Tour script sống trong repo Hydrogen; chạy từ trong thư mục app/
          # để đường dẫn app/build/... trong script trỏ đúng APK.
          script: cd app && bash tour/run_tour.sh

      - name: Collect tour output
        if: always()
        run: |
          mkdir -p hydrogen-tour && cp -r /tmp/tour/* hydrogen-tour/ 2>/dev/null || true
          APK=$(ls app/app/build/outputs/apk/debug/*-universal-debug.apk 2>/dev/null || ls app/app/build/outputs/apk/debug/*-debug.apk 2>/dev/null | head -1)
          [ -n "$APK" ] && cp "$APK" hydrogen-tour/app-debug.apk && (cd hydrogen-tour && sha256sum app-debug.apk > app-debug.apk.sha256) || true
          ls -la hydrogen-tour/

      - name: Commit tour output to repo
        if: always()
        run: |
          git config user.name "Astra"
          git config user.email "astra@kenhlive.local"
          git add hydrogen-tour/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "hydrogen tour: exploratory video tour output (run $GITHUB_RUN_ID)"
            git push
          fi

      - name: Upload tour video
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-apk-video-tour
          path: hydrogen-tour/
