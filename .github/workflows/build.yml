name: Build KenhLive TV & iOS

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'Ref của kenhlive-tv cần build (mặc định main)'
        required: false
        default: 'main'
      build_release:
        description: 'Build them APK release (ky bang key dev tam — keystore that chi co o repo kenhlive-tv)'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout KenhLive TV source (private)
        uses: actions/checkout@v4
        with:
          repository: hanhk112023-jpg/kenhlive-tv
          ref: ${{ inputs.app_ref || 'main' }}
          ssh-key: ${{ secrets.APP_CHECKOUT_KEY }}
          path: app
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          OK=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then OK=1; break; else echo "gradle attempt $i failed, retry in 30s"; sleep 30; fi
          done
          [ "$OK" = "1" ] || { echo "::error::Gradle build failed after 3 attempts"; exit 1; }
          APK=$(ls app/build/outputs/apk/debug/*-universal-debug.apk 2>/dev/null || ls app/build/outputs/apk/debug/*-debug.apk | head -1)
          echo "Produced APK: $APK"
          if [ "$APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then cp "$APK" app/build/outputs/apk/debug/app-debug.apk; fi
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          echo "SHA-256: $(cat app-debug.apk.sha256)"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kenhlive-tv-debug
          path: |
            app/app/build/outputs/apk/debug/app-debug.apk
            app/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

  build-release:
    name: Build Android APK (release, dev-signed)
    if: ${{ inputs.build_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout KenhLive TV source (private)
        uses: actions/checkout@v4
        with:
          repository: hanhk112023-jpg/kenhlive-tv
          ref: ${{ inputs.app_ref || 'main' }}
          ssh-key: ${{ secrets.APP_CHECKOUT_KEY }}
          path: app
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare release signing (generate keystore if no secret)
        id: signing
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "Dung keystore da luu trong secret."
            {
              echo "KEYSTORE_B64=$KS_B64"
              echo "KEYSTORE_PASSWORD=***"
              echo "KEY_ALIAS=$KS_ALIAS"
              echo "KEY_PASSWORD=***"
            } >> "$GITHUB_ENV"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Chua co secret KEYSTORE_B64 -> tao keystore moi."
            PASS=*** rand -hex 20)"
            keytool -genkeypair -v -keystore kenhlive.jks -alias kenhlive \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=KenhLive TV, OU=Mobile, O=KenhLive, L=Hanoi, C=VN"
            {
              echo "KEYSTORE_B64=$(base64 -w0 kenhlive.jks)"
              echo "KEYSTORE_PASSWORD=***"
              echo "KEY_ALIAS=kenhlive"
              echo "KEY_PASSWORD=***"
            } >> "$GITHUB_ENV"
            mkdir -p signing-out
            cp kenhlive.jks signing-out/kenhlive.jks
            {
              echo "KenhLive TV release keystore (GIU BI MAT — day la key chinh thuc)"
              echo "file=kenhlive.jks"
              echo "alias=kenhlive"
              echo "storepass=$PASS"
              echo "keypass=$PASS"
              echo "validity=10950 days (~30 nam)"
            } > signing-out/keystore-credentials.txt
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release APK
        working-directory: app
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          OK=0
          for i in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon; then OK=1; break; else echo "gradle attempt $i failed, retry in 30s"; sleep 30; fi
          done
          [ "$OK" = "1" ] || { echo "::error::Gradle build failed after 3 attempts"; exit 1; }
          APK=$(ls app/build/outputs/apk/release/*-universal-release.apk 2>/dev/null || ls app/build/outputs/apk/release/*-release.apk | head -1)
          echo "Produced APK: $APK"
          if [ "$APK" != "app/build/outputs/apk/release/app-release.apk" ]; then cp "$APK" app/build/outputs/apk/release/app-release.apk; fi
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
          echo "SHA-256: $(cat app-release.apk.sha256)"
          ls -lh app-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kenhlive-release
          path: |
            app/app/build/outputs/apk/release/app-release.apk
            app/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
      - name: Upload generated keystore (chi khi moi tao — giu bi mat)
        if: ${{ steps.signing.outputs.generated == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: kenhlive-keystore
          path: signing-out/
          if-no-files-found: error

  build-ipa:
    name: Build iOS IPA (unsigned)
    if: ${{ !inputs.build_release }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout KenhLive iOS source (private)
        uses: actions/checkout@v4
        with:
          repository: hanhk112023-jpg/kenhlive-ios
          ref: main
          ssh-key: ${{ secrets.IOS_CHECKOUT_KEY }}
          path: app-ios
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: app-ios
        run: xcodegen generate
      - name: Build archive (unsigned)
        working-directory: app-ios
        run: |
          xcodebuild archive \
            -project KenhLive.xcodeproj \
            -scheme KenhLive \
            -destination "generic/platform=iOS" \
            -archivePath build/KenhLive.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        working-directory: app-ios
        run: |
          mkdir -p Payload
          cp -R build/KenhLive.xcarchive/Products/Applications/KenhLive.app Payload/
          zip -r -q KenhLive-iOS.ipa Payload
          ls -lh KenhLive-iOS.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KenhLive-iOS-ipa
          path: app-ios/KenhLive-iOS.ipa
          if-no-files-found: error
