name: Build KenhLive TV & iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout KenhLive TV source (private)
        uses: actions/checkout@v4
        with:
          repository: hanhk112023-jpg/kenhlive-tv
          ref: main
          ssh-key: ${{ secrets.APP_CHECKOUT_KEY }}
          path: app
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          OK=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then OK=1; break; else echo "gradle attempt $i failed, retry in 30s"; sleep 30; fi
          done
          [ "$OK" = "1" ] || { echo "::error::Gradle build failed after 3 attempts"; exit 1; }
          APK=$(ls app/build/outputs/apk/debug/*-universal-debug.apk 2>/dev/null || ls app/build/outputs/apk/debug/*-debug.apk | head -1)
          echo "Produced APK: $APK"
          cp "$APK" app/build/outputs/apk/debug/app-debug.apk
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          echo "SHA-256: $(cat app-debug.apk.sha256)"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kenhlive-tv-debug
          path: |
            app/app/build/outputs/apk/debug/app-debug.apk
            app/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

  build-ipa:
    name: Build iOS IPA (unsigned)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout KenhLive iOS source (private)
        uses: actions/checkout@v4
        with:
          repository: hanhk112023-jpg/kenhlive-ios
          ref: main
          ssh-key: ${{ secrets.IOS_CHECKOUT_KEY }}
          path: app-ios
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: app-ios
        run: xcodegen generate
      - name: Build archive (unsigned)
        working-directory: app-ios
        run: |
          xcodebuild archive \
            -project KenhLive.xcodeproj \
            -scheme KenhLive \
            -destination "generic/platform=iOS" \
            -archivePath build/KenhLive.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        working-directory: app-ios
        run: |
          mkdir -p Payload
          cp -R build/KenhLive.xcarchive/Products/Applications/KenhLive.app Payload/
          zip -r -q KenhLive-iOS.ipa Payload
          ls -lh KenhLive-iOS.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KenhLive-iOS-ipa
          path: app-ios/KenhLive-iOS.ipa
          if-no-files-found: error
