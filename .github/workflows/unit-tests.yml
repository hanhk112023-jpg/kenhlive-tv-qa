name: Unit Tests

# Chạy unit test JVM của app KenhLive TV ở repo kenhlive-tv-qa (từ khi dọn repo 2026-11-11):
# checkout mã nguồn app riêng tư (deploy key APP_CHECKOUT_KEY, path app/).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout KenhLive TV app source (private)
        uses: actions/checkout@v4
        with:
          repository: hanhk112023-jpg/kenhlive-tv
          ref: feature/cinema-apple-cache
          ssh-key: ${{ secrets.APP_CHECKOUT_KEY }}
          path: app

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests
        working-directory: app
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kenhlive-unit-test-reports
          path: app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
