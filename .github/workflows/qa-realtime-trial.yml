name: QA-Realtime-Trial

# QA realtime — chạy ở repo kenhlive-tv-qa (từ khi dọn repo 2026-11-11):
# app source checkout riêng (riêng tư, deploy key APP_CHECKOUT_KEY, path app/),
# harness chạy từ ./harness (bản sao qa/kenhlive_qa/).
# `gh workflow run qa-realtime-trial.yml --ref main -f quick=false` cho full 17 mission.
# Cần secret ở repo này: APP_CHECKOUT_KEY (đã có) + GEMINI_API_KEY /
# NVIDIA_API_KEY / METEOR_API_KEY (AI brain).
# Proxy VN lay tu file GitHub cong khai Au1rxx — KHONG can secret YUNA nua
# (Evelyn 2026-11-12); khong co proxy thi trial FAIL ON AO, khong chay
# lang le khong proxy.
on:
  workflow_dispatch:
    inputs:
      quick:
        description: 'Chế độ nhanh (5 mission trọng tâm: Cold Start, Home, IPTV, Phim, Player Settings)'
        type: boolean
        default: true
      file_url:
        description: 'Link file phiên bản khác (Google Drive /file/d/<id>/view, link trực tiếp .zip source hoặc .apk) — để trống = test kenhlive-tv@main'
        required: false
        default: ''
      version_name:
        description: 'Tên phiên bản (đặt tên artifact, vd: hydrogen-v2)'
        required: false
        default: 'main'

# Tier 1: job QA chỉ đọc code và upload artifact, không cần ghi contents.
permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Checkout KenhLive TV app source (private)
        if: inputs.file_url == ''
        uses: actions/checkout@v4
        with:
          repository: hanhk112023-jpg/kenhlive-tv
          ref: main
          ssh-key: ${{ secrets.APP_CHECKOUT_KEY }}
          path: app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get version source (file_url)
        id: source
        if: inputs.file_url != ''
        run: |
          set -e
          URL="${{ inputs.file_url }}"
          if echo "$URL" | grep -q "drive.google.com.*\/d\/"; then
            ID=$(echo "$URL" | sed -n 's|.*\/d\/\([^/]*\).*|\1|p')
            curl -sL "https://drive.google.com/uc?export=download&id=$ID" -o version-file
          else
            curl -sL "$URL" -o version-file
          fi
          TYPE=$(file -b version-file)
          echo "Downloaded: $TYPE ($(stat -c%s version-file) bytes)"
          if unzip -l version-file 2>/dev/null | grep -q " AndroidManifest.xml$"; then
            cp version-file version.apk
            echo "kind=apk" >> $GITHUB_OUTPUT
            echo "project=" >> $GITHUB_OUTPUT
          elif echo "$TYPE" | grep -qi "Zip archive"; then
            mkdir -p version-src
            unzip -q version-file -d version-src
            if [ -f version-src/KenhLive/settings.gradle.kts ] || [ -f version-src/KenhLive/settings.gradle ]; then
              echo "project=version-src/KenhLive" >> $GITHUB_OUTPUT
            elif [ -f version-src/settings.gradle.kts ] || [ -f version-src/settings.gradle ]; then
              echo "project=version-src" >> $GITHUB_OUTPUT
            else
              echo "::error::ZIP khong chua Android project (khong thay settings.gradle*)"; exit 1
            fi
            echo "kind=source" >> $GITHUB_OUTPUT
          else
            echo "::error::File khong phai ZIP source hay APK: $TYPE"; exit 1
          fi

      - name: Gradle version (file_url)
        id: gradle-ver
        if: inputs.file_url != '' && steps.source.outputs.kind != 'apk'
        run: |
          P="${{ steps.source.outputs.project }}"
          V="8.5"
          if [ -f "$P/gradle/wrapper/gradle-wrapper.properties" ]; then
            V=$(grep distributionUrl "$P/gradle/wrapper/gradle-wrapper.properties" | sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip/\1/p')
            V="${V:-8.5}"
          fi
          echo "Gradle version: $V (project: $P)"
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Setup Gradle (file_url)
        if: inputs.file_url != '' && steps.source.outputs.kind != 'apk'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ steps.gradle-ver.outputs.version }}

      - name: Patch known Hydrogen compile error (file_url)
        if: inputs.file_url != '' && steps.source.outputs.kind != 'apk'
        run: |
          P="${{ steps.source.outputs.project }}"
          F="$P/app/src/main/java/com/kenhlive/tv/logic/TeamNameMatcher.kt"
          if [ -f "$F" ] && grep -q "COMBINING_MARKS_REGEX.matcher(" "$F"; then
            sed -i 's/COMBINING_MARKS_REGEX\.matcher(\(.*\))\.replaceAll("")/COMBINING_MARKS_REGEX.replace(\1, "")/' "$F"
            echo "PATCHED: $F — loi cua Hydrogen (Kotlin Regex khong co .matcher()). Sua dung 1 dong; ban goc KHONG bien dich duoc."
          else
            echo "No TeamNameMatcher patch needed"
          fi

      - name: Launcher activities (file_url, source)
        id: acts
        if: inputs.file_url != '' && steps.source.outputs.kind != 'apk'
        run: |
          P="${{ steps.source.outputs.project }}"
          OUT=$(python3 - "$P/app/src/main/AndroidManifest.xml" <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          t = ET.parse(sys.argv[1]); r = t.getroot()
          launcher = main = ""
          for a in r.iter('activity'):
              name = a.get('{http://schemas.android.com/apk/res/android}name', '')
              if name.endswith('MainActivity'): main = name
              cats = [c.get('{http://schemas.android.com/apk/res/android}name', '') for f in a.iter('intent-filter') for c in f.iter('category')]
              if any('LAUNCHER' in (c or '') for c in cats): launcher = name
          print(launcher or ".MainActivity")
          print(main or ".MainActivity")
          PYEOF
          )
          echo "launcher=$(echo "$OUT" | sed -n '1p')" >> $GITHUB_OUTPUT
          echo "main=$(echo "$OUT" | sed -n '2p')" >> $GITHUB_OUTPUT
          echo "LAUNCHER=$(echo "$OUT" | sed -n '1p') MAIN=$(echo "$OUT" | sed -n '2p')"

      - name: Build debug APK
        run: |
          set -e
          mkdir -p qa-apk
          if [ -n "${{ inputs.file_url }}" ]; then
            if [ "${{ steps.source.outputs.kind }}" = "apk" ]; then
              cp version.apk qa-apk/app-debug.apk
            else
              P="${{ steps.source.outputs.project }}"
              echo "sdk.dir=$ANDROID_HOME" > "$P/local.properties"
              OK=0
              for i in 1 2 3; do
                if (cd "$P" && gradle assembleDebug --no-daemon); then OK=1; break; else echo "gradle attempt $i that bai, cho 30s roi thu lai"; sleep 30; fi
              done
              [ "$OK" = "1" ] || { echo "::error::Gradle build that bai sau 3 lan"; exit 1; }
              APK=$(ls $P/app/build/outputs/apk/debug/*-universal-debug.apk 2>/dev/null || ls $P/app/build/outputs/apk/debug/*-debug.apk 2>/dev/null | head -1)
              [ -n "$APK" ] && [ -f "$APK" ] || { echo "::error::khong thay APK debug"; exit 1; }
              cp "$APK" qa-apk/app-debug.apk
            fi
          else
            echo "sdk.dir=$ANDROID_HOME" > app/local.properties
            chmod +x app/gradlew
            # services.gradle.org hay timeout/504: thu lai toi 3 lan, moi lan cach 30s
            OK=0
            for i in 1 2 3; do
              if (cd app && ./gradlew assembleDebug --no-daemon); then OK=1; break; else echo "gradle attempt $i that bai, cho 30s roi thu lai"; sleep 30; fi
            done
            [ "$OK" = "1" ] || { echo "::error::Gradle build that bai sau 3 lan"; exit 1; }
            if [ -f app/app/build/outputs/apk/debug/app-universal-debug.apk ]; then
              cp app/app/build/outputs/apk/debug/app-universal-debug.apk qa-apk/app-debug.apk
            else
              cp app/app/build/outputs/apk/debug/app-debug.apk qa-apk/app-debug.apk
            fi
          fi
          ls -la qa-apk/

      # proxy VN — lay node VLESS VN moi nhat tu file GitHub cong khai Au1rxx
      # (free-vpn-subscriptions/output/country/VN/singbox-0001.json), chay bang
      # sing-box v1.14.4 (ban da kiem tren may ao Astra 2026-11-12).
      # Tai sing-box: chinh = APT deb.sagernet.org (da cai thanh cong ngay lan 1
      # tren runner, run 43164647966); fallback = gh release download (qua
      # api.github.com; that bai x3 tren runner cung run do, 'no assets match
      # the file pattern' — chua ro nguyen nhan, xem DESIGN.md 15.16).
      # BO YUNA (Evelyn 2026-11-12): khong can secret nao nua.
      # FAIL ON AO neu khong lay duoc file / khong co node song / exit IP
      # khong phai VN — tuyet doi khong chay lang le khong proxy (loi cu).
      - name: Set up proxy VN (file GitHub Au1rxx)
        run: |
          set -euo pipefail
          python3 harness/gh_vn_to_singbox.py /tmp/singbox_ci.json || { echo "::error::Khong lay duoc file proxy VN tu GitHub"; exit 1; }
          SB_VER=v1.14.4
          SB_TGZ="sing-box-${SB_VER}-linux-amd64-glibc.tar.gz"
          SB=""
          # Nguon chinh: APT deb.sagernet.org (host khac han, khong phu thuoc
          # GitHub; da cai thanh cong ngay lan 1 tren runner, run 43164647966,
          # sing-box 1.14.4, exit IP VN 150.95.109.109).
          # Pin version APT theo SB_VER (bo 'v' — version deb la 1.14.4,
          # khong co 'v'; '*' khop ca hau to neu co): repo len ban moi thi
          # CI FAIL on ao thay vi am tham doi version.
          # install -d NAM TRONG khoi if (dau chuoi &&): neu no fail, dieu
          # kien false -> roi xuong fallback gh, thay vi set -e kill step.
          if sudo install -d -m 0755 /etc/apt/keyrings && sudo curl -fsSL https://sing-box.app/gpg.key -o /etc/apt/keyrings/sagernet.asc && sudo chmod a+r /etc/apt/keyrings/sagernet.asc && printf 'Types: deb\nURIs: https://deb.sagernet.org/\nSuites: *\nComponents: *\nEnabled: yes\nSigned-By: /etc/apt/keyrings/sagernet.asc\n' | sudo tee /etc/apt/sources.list.d/sagernet.sources >/dev/null && (sudo apt-get update -qq -o Acquire::http::Timeout=30 -o Acquire::Retries=3 || true) && sudo apt-get install -y -qq "sing-box=${SB_VER#v}*"; then
            SB="$(command -v sing-box || true)"
          fi
          if [ -n "$SB" ] && [ -x "$SB" ]; then
            echo "dung sing-box tu APT: $SB"
          else
            # Fallback: gh release download (qua api.github.com, tranh lop
            # github.com/releases/download da 404 x3, run 43161910696).
            # Luu y: gh that bai x3 tren runner run 43164647966 ('no assets
            # match the file pattern') du van chay tren may ao — neu fallback
            # nay cung that bai, xem DESIGN.md 15.16.
            echo "APT that bai — thu fallback gh release download"
            OK_DL=0
            for try in 1 2 3; do
              rm -f "/tmp/${SB_TGZ}"
              if gh release download "${SB_VER}" --repo SagerNet/sing-box --pattern "${SB_TGZ}" --dir /tmp --clobber && gzip -t "/tmp/${SB_TGZ}" 2>/dev/null; then OK_DL=1; break; fi
              echo "gh release download lan $try loi, thu lai sau 15s"; sleep 15
            done
            if [ "$OK_DL" = "1" ]; then
              tar xzf "/tmp/${SB_TGZ}" -C /tmp
              SB="/tmp/sing-box-${SB_VER}-linux-amd64-glibc/sing-box"
            fi
            [ -n "$SB" ] && [ -x "$SB" ] || { echo "::error::Khong tai/cai duoc sing-box (APT + gh x3 that bai)"; exit 1; }
            echo "dung sing-box tu gh release download: $SB"
          fi
          "$SB" version | head -1
          "$SB" check -c /tmp/singbox_ci.json
          nohup "$SB" run -c /tmp/singbox_ci.json > /tmp/singbox.log 2>&1 &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/7891) 2>/dev/null && break; sleep 2; done
          (echo > /dev/tcp/127.0.0.1/7891) 2>/dev/null || { echo "::error::sing-box khong mo port 7891"; tail -30 /tmp/singbox.log; exit 1; }
          VN_CC="?"
          for i in 1 2 3; do
            VN_CC=$(curl -sS -m 30 -x http://127.0.0.1:7891 https://ipwho.is/ 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('country_code','?'))" 2>/dev/null || echo "?")
            echo "exit IP country (lan $i): $VN_CC"
            [ "$VN_CC" = "VN" ] && break
            sleep 15
          done
          [ "$VN_CC" = "VN" ] || { echo "::error::Proxy VN khong cho exit IP Viet Nam sau 3 lan (country=$VN_CC) — DUNG TRIAL, khong chay khong proxy"; tail -30 /tmp/singbox.log; exit 1; }
          echo "exit IP: $(curl -sS -m 15 -x http://127.0.0.1:7891 https://api.ipify.org || echo '?')"
          echo "HAS_PROXY=1" >> "$GITHUB_ENV"

      - name: KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install deps
        run: |
          sudo apt-get update -qq -o Acquire::http::Timeout=20 -o Acquire::Retries=3
          # ffmpeg BẮT BUỘC: CI-T2 chứng minh runner không có ffmpeg/ffprobe
          # (concat rc=127 'ffmpeg: not found' -> video chỉ còn 1 chunk 175s
          # dù 13 chunk đã giữ được nhờ fix _dur). ffprobe đi kèm gói ffmpeg.
          sudo apt-get install -y -qq --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-vie
          pip install --quiet pillow pytesseract

      # AI Brain: Ưu tiên Google AI Studio (Gemini free tier) → NVIDIA NIM (free tier,
      # OpenAI-compatible, có vision) → fallback Meteor gateway.
      # Preflight chạy trên runner (mạng mở): chọn model vision tốt nhất và bắn thử 1 chat completion
      # để fail-fast trước khi tốn thời gian dựng emulator.
      - name: Preflight AI (chọn nhà cung cấp + model + kiểm tra key)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          METEOR_API_KEY: ${{ secrets.METEOR_API_KEY }}
          METEOR_API_BASE: http://meteor.pikamc.vn:25155/v1
        run: |
          set -euo pipefail
          if [ -n "$NVIDIA_API_KEY" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "✅ Dùng NVIDIA NIM (OpenAI-compatible, free tier)"
            echo "AI_PROVIDER=NVIDIA" >> "$GITHUB_ENV"
            echo "AI_BASE_URL=https://integrate.api.nvidia.com/v1" >> "$GITHUB_ENV"
            echo "AI_API_KEY=$NVIDIA_API_KEY" >> "$GITHUB_ENV"
            curl -sS -m 30 -H "Authorization: Bearer $NVIDIA_API_KEY" \
              "https://integrate.api.nvidia.com/v1/models" -o /tmp/models.json || true
            MODEL=$(python3 - << 'PYEOF'
          import json, sys
          try:
              ids = [m.get("id", "") for m in json.load(open("/tmp/models.json")).get("data", [])]
          except Exception as e:
              print(f"models parse error: {e}", file=sys.stderr); ids = []
          print("MODELS: " + ", ".join(ids[:50]), file=sys.stderr)
          # Ưu tiên model vision cho QA screenshot (test 2026-11-08: nemotron-3.5-super-vl
          # nhanh nhat trong cac model chay duoc, 22s/anh; step-5 tra content rong nen bo ra)
          pref = ["nemotron-3.5-super-vl", "gemma-4-31b", "llama-3.2-90b-vision", "llama-4-maverick",
                  "nemotron-nano", "mistral-large"]
          # Tra ve FULL model id khop pref (khong tra chuoi pref: "nemotron-3.5-super-vl"
          # khong phai id hop le, goi API se 404 va brain roi ve LOCAL_REFLEX)
          picked = next((i for p in pref for i in ids if p in i.lower()), "")
          if not picked:
              vis = [i for i in ids if "vision" in i.lower() or "vl" in i.lower()]
              picked = vis[0] if vis else (ids[0] if ids else "")
          print(picked)
          PYEOF
          )
            [ -n "$MODEL" ] || MODEL="nvidia/nemotron-3.5-super-vl-120b-a12b"
            echo "AI_MODEL=$MODEL" >> "$GITHUB_ENV"
            echo "Model AI QA được chọn: $MODEL"
            echo "Kiểm tra chat completion..."
            curl -sS -m 40 -H "Authorization: Bearer $NVIDIA_API_KEY" -H "Content-Type: application/json" \
              -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Tra loi dung mot tu: OK\"}],\"max_tokens\":256}" \
              "https://integrate.api.nvidia.com/v1/chat/completions" | head -c 600; echo
          elif [ -n "$GEMINI_API_KEY" ]; then
            echo "✅ Dùng Google AI Studio (Gemini free tier, OpenAI-compatible)"
            echo "AI_PROVIDER=GEMINI" >> "$GITHUB_ENV"
            echo "AI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai" >> "$GITHUB_ENV"
            echo "AI_API_KEY=$GEMINI_API_KEY" >> "$GITHUB_ENV"
            # Liệt kê model Gemini khả dụng
            curl -sS -m 30 -H "Authorization: Bearer $GEMINI_API_KEY" \
              "https://generativelanguage.googleapis.com/v1beta/openai/models" -o /tmp/models.json || true
            MODEL=$(python3 - << 'PYEOF'
          import json, sys
          try:
              ids = [m.get("id", "") for m in json.load(open("/tmp/models.json")).get("data", [])]
          except Exception as e:
              print(f"models parse error: {e}", file=sys.stderr); ids = []
          print("MODELS: " + ", ".join(ids), file=sys.stderr)
          # Ưu tiên Gemini Flash mới nhất (vision tốt, free tier 1500 req/ngày)
          pref = ["gemini-3-flash", "gemini-2.5-flash", "gemini-3-pro", "gemini-2.5-pro", "gemini-2.0-flash"]
          # Tra ve FULL model id khop pref (xem ghi chu o nhanh NVIDIA)
          picked = next((i for p in pref for i in ids if p in i.lower()), "")
          if not picked:
              vis = [i for i in ids if "gemini" in i.lower() or "gpt-4o" in i.lower() or "claude" in i.lower()]
              picked = vis[0] if vis else (ids[0] if ids else "")
          print(picked)
          PYEOF
          )
            [ -n "$MODEL" ] || MODEL="gemini-2.5-flash"
            echo "AI_MODEL=$MODEL" >> "$GITHUB_ENV"
            echo "Model AI QA được chọn: $MODEL"
            echo "Kiểm tra chat completion..."
            curl -sS -m 40 -H "Authorization: Bearer $GEMINI_API_KEY" -H "Content-Type: application/json" \
              -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Tra loi dung mot tu: OK\"}],\"max_tokens\":8}" \
              "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" | head -c 600; echo
          else
            echo "⚠️ Chưa có GEMINI_API_KEY — fallback về Meteor gateway"
            echo "AI_PROVIDER=METEOR" >> "$GITHUB_ENV"
            echo "AI_BASE_URL=$METEOR_API_BASE" >> "$GITHUB_ENV"
            echo "AI_API_KEY=$METEOR_API_KEY" >> "$GITHUB_ENV"
            echo "Lấy danh sách model từ Meteor..."
            curl -sS -m 30 -H "Authorization: Bearer $METEOR_API_KEY" "$METEOR_API_BASE/models" -o /tmp/models.json
            head -c 2000 /tmp/models.json; echo
            MODEL=$(python3 - << 'PYEOF'
          import json, sys
          try:
              ids = [m.get("id", "") for m in json.load(open("/tmp/models.json")).get("data", [])]
          except Exception as e:
              print(f"models parse error: {e}", file=sys.stderr); ids = []
          print("MODELS: " + ", ".join(ids), file=sys.stderr)
          g38 = [i for i in ids if "gemini-3.8-flash" in i.lower()]
          if g38:
              high = [i for i in g38 if "high" in i.lower()]
              picked = high[0] if high else g38[0]
          else:
              pref = ["gpt-4o", "gpt-4o-mini", "gemini-2.5-flash", "gemini-2.0-flash", "claude-sonnet-4-5", "deepseek-chat"]
              picked = next((p for p in pref if p in ids), "")
              if not picked:
                  vis = [i for i in ids if "gpt-4o" in i or "gemini" in i or "claude" in i]
                  picked = vis[0] if vis else (ids[0] if ids else "")
          print(picked)
          PYEOF
          )
            [ -n "$MODEL" ] || { echo "::error::Không chọn được model từ Meteor"; exit 1; }
            echo "AI_MODEL=$MODEL" >> "$GITHUB_ENV"
            echo "Model AI QA được chọn: $MODEL"
            echo "Kiểm tra chat completion..."
            curl -sS -m 40 -H "Authorization: Bearer $METEOR_API_KEY" -H "Content-Type: application/json" \
              -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Tra loi dung mot tu: OK\"}],\"max_tokens\":8}" \
              "$METEOR_API_BASE/chat/completions" | head -c 600; echo
          fi

      - name: Chạy Realtime Vision QA trên Android TV emulator
        env:
          # Meteor là AI Brain DUY NHẤT: các gateway cũ để trống có chủ đích để
          # AIBrain._detect_provider chọn OPENAI (Meteor) làm engine chính.
          DEEPSEEK_API_BASE: ""
          ANTIGRAVITY_API_BASE: ""
          ANTIGRAVITY_API_KEY: ""
          KILO_API_KEY: ""
          OPENAI_API_BASE: ${{ env.AI_BASE_URL }}
          OPENAI_API_KEY: ${{ env.AI_API_KEY }}
          OPENAI_MODEL: ${{ env.AI_MODEL }}
          # Phiên bản khác (file_url): activity dò từ manifest (vd: Hydrogen v2
          # launcher=.ui.SplashActivity, main=.ui.MainActivity). Để trống =
          # harness dùng .MainActivity như bản chính.
          QA_LAUNCHER_ACTIVITY: ${{ steps.acts.outputs.launcher }}
          QA_MAIN_ACTIVITY: ${{ steps.acts.outputs.main }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          script: |
            adb root
            if [ "${{ env.HAS_PROXY }}" = "1" ]; then adb shell settings put global http_proxy 10.0.2.2:7891; fi
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb install -r qa-apk/app-debug.apk
            # Launcher rieng cho test (module :testlauncher, chỉ có ở bản chính):
            # HOME duy nhat, khong co YouTube de script bam mu lac sang
            # (bai hoc UI-Tour 2026-11-05). Phiên bản khác không có module này
            # thì bỏ qua.
            if [ -f app/testlauncher/build/outputs/apk/debug/testlauncher-debug.apk ]; then
              adb install -r app/testlauncher/build/outputs/apk/debug/testlauncher-debug.apk || true
              adb shell cmd package set-home-activity com.kenhlive.testlauncher/com.kenhlive.testlauncher.TestLauncherActivity >/dev/null 2>&1 || true
            fi
            adb shell pm disable-user com.google.android.youtube.tv >/dev/null 2>&1 || true
            adb shell pm disable-user com.google.android.youtube.tv.kids >/dev/null 2>&1 || true
            adb logcat -c
            # CI-T2: full mode (17 mission) — đo wall time toàn bộ so với
            # baseline 74m26s. Push dispatch không có inputs.quick nên ARGS=""
            # là full mode; dispatch tay với quick=true thì chạy --quick.
            ARGS=""
            if [ "${{ inputs.quick }}" = "true" ]; then ARGS="--quick"; fi
            mkdir -p qa_out /tmp/qa_report
            # Harness mới: realtime (evidence-gated, vision chỉ khi cần).
            # --quick: 5 mission trọng tâm. Ngân sách vision mặc định 40/run.
            python3 harness/realtime/run_realtime.py --out qa_out $ARGS || true
            cp -r qa_out/* /tmp/qa_report/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report-realtime-${{ inputs.version_name }}
          path: qa_out/

      - name: Kết quả
        if: always()
        run: python3 harness/ci_report.py
