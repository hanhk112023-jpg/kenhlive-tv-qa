name: APK Video Tour

# Quay video quá trình test APK mới (main line: source cũ + waves 1-5)
# trên Android TV emulator. Tour KHÁM PHÁ: không theo kịch bản cứng, chỉ dùng
# các thao tác chung (DPAD, ENTER, BACK, screenshot, UI dump) rồi tự dò:
# đi hết rail ghi lại nhãn, vào nội dung, mở từng tab khám phá ra, BACK,
# kiểm tra crash qua logcat. Không proxy, không launcher phụ.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout QA repo (tour scripts)
        uses: actions/checkout@v4

      - name: Checkout KenhLive TV source (private)
        uses: actions/checkout@v4
        with:
          repository: hanhk112023-jpg/kenhlive-tv
          ref: main
          ssh-key: ${{ secrets.APP_CHECKOUT_KEY }}
          path: app

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Maven Central thỉnh thoảng trả 429 trên runner dùng chung IP
          # (tour 43492590078 chết ở đây) — thử lại tối đa 3 lần như build.yml.
          OK=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then OK=1; break; else echo "gradle attempt $i failed, retry in 30s"; sleep 30; fi
          done
          [ "$OK" = "1" ] || { echo "::error::Gradle build failed after 3 attempts"; exit 1; }

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Run video tour on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          script: bash tour/run_tour.sh

      - name: Collect tour output
        if: always()
        run: |
          mkdir -p tour_out && cp -r /tmp/tour/* tour_out/ 2>/dev/null || true
          ls -la tour_out/

      - name: Upload tour video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-video-tour
          path: tour_out/
