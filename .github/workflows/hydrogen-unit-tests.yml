name: Hydrogen Unit Tests

# Chạy unit test JVM của bản Hydrogen (source trong repo này: hydrogen/).
# Upload report là phụ (continue-on-error) vì artifact storage đang đầy.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests
        working-directory: hydrogen
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-unit-test-reports
          path: hydrogen/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
